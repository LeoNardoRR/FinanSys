{% extends "base.html" %}{% block content %}<div class="page-heading"><div><h2>Editar lançamento</h2><p>Altere os dados deste item. As demais parcelas não serão modificadas.</p></div><a class="btn" href="/transactions">Voltar</a></div><div class="card"><div class="card-body"><form method="post" class="form-grid">
<div class="field wide"><label>Descrição</label><input class="control" name="description" value="{{ item.description }}" required></div><div class="field"><label>Valor (R$)</label><input class="control" name="amount" value="{{ item.amount }}" required></div><div class="field"><label>Data</label><input class="control" type="date" name="occurred_on" value="{{ item.occurred_on }}" required></div>
<div class="field"><label>Tipo</label><select class="control" name="kind"><option value="expense" {% if item.kind=='expense' %}selected{% endif %}>Despesa</option><option value="income" {% if item.kind=='income' %}selected{% endif %}>Receita</option></select></div>
<div class="field"><label>Categoria</label><select class="control" name="category_id"><option value="">Sem categoria</option>{% for x in categories %}<option value="{{ x.id }}" {% if item.category_id==x.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div>
<div class="field"><label>Conta</label><select class="control" name="bank_id"><option value="">Não informada</option>{% for x in banks %}<option value="{{ x.id }}" {% if item.bank_id==x.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div>
<div class="field"><label>Pagamento</label><select class="control" name="payment_method_id"><option value="">Não informado</option>{% for x in payment_methods %}<option value="{{ x.id }}" {% if item.payment_method_id==x.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div>
<div class="field"><label>Cartão</label><select class="control" name="card_id"><option value="">Não se aplica</option>{% for x in cards %}<option value="{{ x.id }}" {% if item.card_id==x.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div><div class="field"><label>Pessoa</label><select class="control" name="person_id"><option value="">Família</option>{% for x in people %}<option value="{{ x.id }}" {% if item.person_id==x.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div>
<div class="field wide"><label>Observações</label><textarea class="control" name="notes">{{ item.notes or '' }}</textarea></div><div class="field full button-row"><button class="btn btn-primary">Salvar alterações</button><a class="btn" href="/transactions">Cancelar</a></div></form></div></div>{% endblock %}
